spring:
  application:
    name: ride-matching
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rides}
    username: ${POSTGRES_USER:rides}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

rides:
  drivers:
    stale-after: 15s
    sweep-interval: 5s
  matching:
    radii-km: [1.0, 2.0, 4.0, 8.0]
    candidates-per-radius: 10
    offer-timeout: 10s
    max-attempts: 10
    retry-delay: 3s
    poll-interval: 500ms
  eta:
    avg-speed-kmh: 25
    detour-factor: 1.3

management:
  endpoints:
    web:
      exposure:
        include: health,info
